[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pycamerad"
version = "0.1.0"
description = "Typed Python access to a camerad camera"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# camera_interface is a compiled extension built per instrument from
# camera-interface, so it cannot be resolved from an index
dependencies = []
authors = [
  { name = "Caltech Optical Observatories" }
]

[project.urls]
Repository = "https://github.com/COO-Utilities/pycamerad"
"Bug Tracker" = "https://github.com/COO-Utilities/pycamerad/issues"

[project.optional-dependencies]
dev = ["pylint", "pytest"]

[tool.setuptools]
packages = ["pycamerad"]
package-dir = { pycamerad = "." }
